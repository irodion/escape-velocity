name: CI

on:
  # `push` validates the merge commit that lands on `main` (a form CI never
  # saw on the PR branch) and warms a main-branch `rust-cache` that future PR
  # branches inherit. `workflow_dispatch` allows a manual re-run.
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install Rust toolchain (pinned via rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@aad518f59d88bae90133242f9ddac7f8bbc5dddf # 1.94.1
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --workspace

      - name: cargo-deny (advisories + licenses)
        # RUSTSEC advisories and GPL-compatible license enforcement for the
        # Rust tree (policy in deny.toml); the `vet` job covers npm. Scoped to
        # the two checks deny.toml configures.
        uses: EmbarkStudios/cargo-deny-action@bb137d7af7e4fb67e5f82a49c4fce4fad40782fe # v2.0.20
        with:
          command: check advisories licenses

  web:
    name: Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install Rust toolchain (pinned via rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@aad518f59d88bae90133242f9ddac7f8bbc5dddf # 1.94.1
        with:
          targets: wasm32-unknown-unknown

      - name: Install nightly Rust for the WASM thread build (Slice 7B)
        # wasm-bindgen-rayon needs `std` recompiled with shared-memory
        # atomics (`build-std`), which is nightly-only and requires the
        # `rust-src` component. Pinned to a fixed date so the multicore
        # artifact is reproducible. Installed explicitly via rustup (which
        # is preinstalled on the runner) rather than the dtolnay action,
        # so `rustup run nightly-2025-11-15` in the build step and the
        # `wasm:build` script resolves it by name. Native fmt/clippy/test
        # stay on the stable toolchain above (the `rust` job).
        run: rustup toolchain install nightly-2025-11-15 --profile minimal --component rust-src --target wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: Install wasm-pack
        # Compile from source via cargo for supply-chain consistency with
        # the rest of the Rust pipeline. The binary lives at ~/.cargo/bin
        # and isn't covered by rust-cache's default cache; reinstalls on
        # every CI run (~30s with a warm registry).
        run: cargo install --locked wasm-pack@0.15.0

      - name: Build WASM artifact (nightly + build-std for WASM threads, Slice 7B)
        run: rustup run nightly-2025-11-15 wasm-pack build crates/fractal-wasm --target web --out-dir ../../web/wasm --release

      - uses: pnpm/action-setup@v6
        with:
          version: 10.30.1

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Biome (format + lint)
        working-directory: web
        run: pnpm lint

      # The WASM artifact is already built explicitly above, so use the
      # `:only` script variants to skip the wasm:build the chained
      # `typecheck`/`test` scripts would otherwise re-run (twice).
      - name: TypeScript check
        working-directory: web
        run: pnpm typecheck:only

      - name: Vitest
        working-directory: web
        run: pnpm test:only

      - name: Build
        working-directory: web
        run: pnpm build

  vet:
    name: Dependency check (safedep/vet)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Run vet
        uses: safedep/vet-action@e2a78850eb517b8305b1085bca947bef29213a22 # v1
        with:
          policy: .github/vet/policy.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
