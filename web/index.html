<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Escape Velocity</title>
    <style>
      /* Fit-to-window (Slice 2): the page is a flex column whose canvas
         fills the window. The canvas's CSS box is the viewport's logical
         size; main.ts measures it (and re-measures on resize) to size the
         render buffer. The render-scale multiplier then super/sub-samples
         that buffer without changing the framing or the display size.

         Controls drawer (Slice 4): the controls panel is fixed-positioned
         and so removed from the flex flow — the canvas owns the whole
         window, and opening the drawer overlays it without changing its
         CSS box (so the fit-to-window ResizeObserver never fires). The
         only in-flow sibling below the canvas is the PWA install button. */
      html, body { margin: 0; height: 100%; }
      body { display: flex; flex-direction: column; min-height: 100vh; }
      canvas#fractal {
        cursor: crosshair;
        flex: 1 1 auto;
        min-height: 0;
        width: 100%;
        display: block;
      }
      canvas#fractal.dragging { cursor: all-scroll; }

      /* The ☰ toggle floats above everything, always visible, in the
         top-left corner. It stacks above the drawer so it doubles as the
         close affordance once the panel slides over it. */
      #controls-toggle {
        position: fixed;
        top: 0.75rem;
        left: 0.75rem;
        z-index: 20;
        width: 2.5rem;
        height: 2.5rem;
        padding: 0;
        font-size: 1.25rem;
        line-height: 1;
        color: #f0f0f0;
        background: #1a1a22;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
      }

      /* The drawer slides in from the left over the canvas. Closed by
         default (translated fully off-screen + `inert`, set by drawer.ts);
         `.open` slides it into view. `width: min(20rem, 85vw)` keeps it
         from spanning a narrow phone screen, and the column layout +
         `overflow-y: auto` stack the controls with no horizontal overflow
         and scroll if they outrun a short viewport. */
      form#controls {
        position: fixed;
        top: 0;
        left: 0;
        z-index: 10;
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
        width: min(20rem, 85vw);
        height: 100%;
        margin: 0;
        /* Top padding clears the floating ☰ button. */
        padding: 3.75rem 1rem 1rem;
        overflow-y: auto;
        color: #f0f0f0;
        background: #1a1a22;
        box-shadow: 2px 0 12px rgba(0, 0, 0, 0.4);
        transform: translateX(-100%);
        transition: transform 0.2s ease;
      }
      form#controls.open { transform: translateX(0); }
      form#controls label { display: block; margin: 0; }
      /* Respect a reduced-motion preference: snap instead of slide. */
      @media (prefers-reduced-motion: reduce) {
        form#controls { transition: none; }
      }
      /* Visualise the Mandelbrot-mode state of the `c` inputs: dim the
         input itself, and use `:has()` to dim the surrounding <label>
         so the visitor reads the whole c.re / c.im strip as "off"
         rather than just the field. */
      input[type="number"]:disabled { opacity: 0.5; }
      form#controls label:has(input:disabled) { opacity: 0.6; }
      /* PWA UI (Slice 8B): the Install button sits in normal flow under the
         canvas; the update / offline-ready toast floats bottom-right. Both
         are created and toggled by the pwa-ui presenter via the `hidden`
         attribute, so they take no space until the lifecycle calls for them. */
      #pwa-install { margin-top: 0.5rem; }
      #pwa-install[hidden], .pwa-toast[hidden] { display: none; }
      .pwa-toast {
        position: fixed;
        bottom: 1rem;
        right: 1rem;
        display: flex;
        gap: 0.5rem;
        align-items: center;
        padding: 0.6rem 0.9rem;
        border-radius: 6px;
        background: #1a1a22;
        color: #f0f0f0;
        font-size: 0.9rem;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
      }
    </style>
  </head>
  <body>
    <button
      id="controls-toggle"
      type="button"
      aria-label="Open controls"
      aria-controls="controls"
      aria-expanded="false"
    >
      ☰
    </button>
    <form id="controls">
      <label>
        Iterations:
        <select name="max-iter">
          <option value="64">64</option>
          <option value="128">128</option>
          <option value="256" selected>256</option>
          <option value="512">512</option>
          <option value="1024">1024</option>
          <option value="2048">2048</option>
          <option value="4096">4096</option>
          <option value="8192">8192</option>
        </select>
      </label>
      <label>
        Resolution:
        <select name="render-scale">
          <option value="0.5">0.5× (faster)</option>
          <option value="1" selected>1×</option>
          <option value="2">2× (sharper)</option>
        </select>
      </label>
      <label>
        Palette:
        <select name="palette">
          <option value="grayscale">Grayscale</option>
          <option value="viridis" selected>Viridis</option>
          <option value="magma">Magma</option>
          <option value="inferno">Inferno</option>
          <option value="twilight">Twilight</option>
        </select>
      </label>
      <label>
        Coloring:
        <select name="normalisation">
          <option value="cycled" selected>Cycled</option>
          <option value="histogram">Match palette to image</option>
        </select>
      </label>
      <label>
        Fractal:
        <select name="mode">
          <option value="mandelbrot" selected>Mandelbrot</option>
          <option value="julia">Julia</option>
        </select>
      </label>
      <label>
        c.re:
        <input type="number" name="c-re" step="0.0001" value="-0.7" disabled />
      </label>
      <label>
        c.im:
        <input type="number" name="c-im" step="0.0001" value="0.27015" disabled />
      </label>
    </form>
    <canvas id="fractal" width="800" height="600"></canvas>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
