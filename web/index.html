<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <!-- Match the PWA manifest theme/background and the page ground (#05070b)
         so an installed launch shows no near-black splash flash. -->
    <meta name="theme-color" content="#05070b" />
    <title>Escape Velocity</title>
    <style>
      /* ─────────────────────────── design tokens ───────────────────────────
         The "Instrument Console" skin (Slice 4 redesign). The UI's whole
         component system is this handful of CSS custom properties plus native
         form controls — no framework, no widget library (ADR-0003). `--accent`
         is rewritten from main.ts to track the active palette, so the console
         reads as an instrument tuned to whatever it's rendering. Fonts are
         self-hosted via @fontsource (imported in main.ts) so the offline PWA
         never reaches for a CDN. */
      :root {
        --ink:        #e8ecf1;   /* primary readout text   */
        --ink-dim:    #8b93a3;   /* labels, secondary      */
        --ink-faint:  #5b6373;   /* hairlines, disabled    */
        --panel:      rgba(13, 16, 22, 0.62);     /* translucent slab */
        --panel-edge: rgba(255, 255, 255, 0.1);
        --hair:       rgba(255, 255, 255, 0.08);
        --accent:     #5fd0c0;   /* keyed to palette at runtime (main.ts) */
        --accent-dim: color-mix(in oklab, var(--accent) 28%, transparent);
        --warn:       #e0a05f;   /* precision low — depth meter near the f64 wall */

        --font-mono:  "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
        --font-tech:  "Martian Mono Variable", var(--font-mono);

        --r: 3px;   /* the only rounding — near-square, "instrument" not "card" */
        --ease: cubic-bezier(0.22, 0.61, 0.36, 1);
      }

      *, *::before, *::after { box-sizing: border-box; }

      /* Fit-to-window (Slice 2): the page is a flex column whose canvas fills
         the window. main.ts measures the canvas's CSS box to size the render
         buffer (re-measured on resize via ResizeObserver).

         Controls drawer (Slice 4): the controls panel is fixed-positioned and
         so removed from the flex flow — the canvas owns the whole window, and
         opening the drawer overlays it without changing its CSS box (so the
         fit-to-window ResizeObserver never fires). The only in-flow sibling
         below the canvas is the PWA install button. */
      html, body { margin: 0; height: 100%; }
      body {
        display: flex;
        flex-direction: column;
        min-height: 100dvh;
        background: #05070b;
        color: var(--ink);
        font-family: var(--font-mono);
        -webkit-font-smoothing: antialiased;
      }
      /* The stage owns the window area the fractal fills. It clips the
         canvas (so a zoom-in Preview that scales past the edges never
         spawns scrollbars or bleeds over the drawer) and shows pure black
         where a zoom-out Preview shrinks the canvas inside it — the
         outside-the-set colour, so the revealed border reads as fractal.
         See ADR-0012. */
      .stage {
        position: relative;
        flex: 1 1 auto;
        min-height: 0;
        overflow: hidden;
        background: #000;
      }
      /* Unified probe panel (E1 + E2): the orbit visualizer and the pixel
         inspector are one corner instrument — a translucent slab pinned to the
         stage's bottom-right, mirroring the drawer/toggle skin (panel fill,
         backdrop blur, hairline, the 3px instrument corner). Bottom-right clears
         the top-left toggle and the left drawer; `pointer-events: none` lets a
         pan/zoom that strays under it pass through to the canvas. Either toggle
         summons the panel; each section hides on its own toggle, and `:has`
         collapses the whole panel when neither section is shown — so main.ts
         never touches the wrapper. */
      .probe {
        position: absolute;
        right: max(0.9rem, env(safe-area-inset-right));
        bottom: max(0.9rem, env(safe-area-inset-bottom));
        z-index: 20;
        display: flex;
        flex-direction: column;
        width: min(17rem, 84vw);
        padding: 0.6rem 0.7rem;
        color: var(--ink);
        background: var(--panel);
        -webkit-backdrop-filter: blur(14px) saturate(1.2);
        backdrop-filter: blur(14px) saturate(1.2);
        border: 1px solid var(--panel-edge);
        border-radius: var(--r);
        font-family: var(--font-mono);
        pointer-events: none;
      }
      /* Fold the panel away entirely when neither section is on (both children
         `hidden`), so an empty slab never floats in the corner. */
      .probe:not(:has(> :not([hidden]))) { display: none; }

      /* Orbit diagram (E1, #94): a square chart filling the panel width, drawn
         by orbit.ts into its own local frame (the orbit's bbox fit into the
         box — viewport-independent, so a pinned orbit survives pan/zoom). */
      canvas#orbit {
        display: block;
        width: 100%;
        aspect-ratio: 1 / 1;
        /* On a short (landscape-phone) viewport the full square would overgrow
           the stage and have its top clipped by `.stage { overflow: hidden }`.
           Cap the height to the space left after the readout + insets; the
           width (so the readout) stays put, and `drawFrame` centres a square of
           the box's smaller side — a capped box just yields a smaller centred
           chart. Inactive on tall viewports, where the width caps first. */
        max-height: calc(100dvh - 10rem);
      }
      canvas#orbit[hidden] { display: none; }

      /* Pixel inspector readout (E2, #95): a compact key/value grid with the
         painted-colour swatch. The panel carries the slab; this is just the
         layout + the instrument's mono, tabular figures. */
      .inspector {
        display: grid;
        grid-template-columns: auto auto minmax(0, 1fr);
        align-items: center;
        gap: 0.15rem 0.55rem;
        font-size: 0.82rem;
        line-height: 1.5;
        font-variant-numeric: tabular-nums;
      }
      .inspector[hidden] { display: none; }
      /* A hairline only when both sections show, parting diagram from readout. */
      #orbit:not([hidden]) + .inspector:not([hidden]) {
        margin-top: 0.6rem;
        padding-top: 0.6rem;
        border-top: 1px solid var(--hair);
      }
      /* Swatch: the exact painted colour (set inline by inspector.ts), spanning
         the three readout rows down the left. */
      .inspector__swatch {
        grid-row: 1 / 4;
        grid-column: 1;
        align-self: stretch;
        width: 2.5rem;
        min-height: 2.5rem;
        margin-right: 0.2rem;
        border: 1px solid var(--panel-edge);
        border-radius: var(--r);
        background: #000;
      }
      .inspector__key { color: var(--ink-dim); white-space: nowrap; }
      .inspector__val { color: var(--ink); white-space: nowrap; }
      .inspector__val--inside { color: var(--ink-dim); font-style: italic; }

      canvas#fractal {
        cursor: crosshair;
        width: 100%;
        height: 100%;
        display: block;
        /* The canvas owns all of its gestures (U1, #88): without this the
           browser claims one-finger drags for page scroll and two-finger
           pinches for page zoom, so the InputController's Pointer Events never
           see them. `none` hands every touch to us — pan, pinch, and tap. */
        touch-action: none;
        /* Anchor the wheel-zoom Preview transform at the top-left so the
           `zoom-preview` affine (p ↦ scale·p + t) holds exactly. */
        transform-origin: 0 0;
      }
      canvas#fractal.dragging { cursor: all-scroll; }

      /* A faint vignette so the translucent panel edge always has something to
         sit against, whatever the fractal happens to show. Its job only applies
         while the drawer is open, so it's shown *only then* (gated on the
         drawer's `.open` class below) — with the drawer closed the image is the
         whole point and the corners stay clean. Pure decoration —
         pointer-events: none keeps it out of the way of canvas pan/zoom. */
      .vignette {
        position: fixed;
        inset: 0;
        z-index: 5;
        pointer-events: none;
        opacity: 0;
        background: radial-gradient(
          120% 120% at 30% 40%,
          transparent 55%,
          rgba(0, 0, 0, 0.45) 100%
        );
        transition: opacity 0.26s var(--ease);
      }
      /* DOM order is form#controls → .stage → .vignette, so the general-sibling
         combinator reaches the vignette when the drawer opens. */
      form#controls.open ~ .vignette { opacity: 1; }

      /* ─────────────────────────── the toggle ───────────────────────────
         A *drawn* crosshair (SVG injected by drawer.ts) that echoes the
         canvas's crosshair cursor: the affordance points at what the panel
         controls. It stacks above the drawer so it doubles as the close
         affordance once the panel slides over it, morphing to an ✕ on open. */
      #controls-toggle {
        position: fixed;
        top: max(0.9rem, env(safe-area-inset-top));
        left: max(0.9rem, env(safe-area-inset-left));
        z-index: 30;
        display: grid;
        place-items: center;
        width: 2.85rem;
        height: 2.85rem;
        padding: 0;
        color: var(--ink);
        background: var(--panel);
        -webkit-backdrop-filter: blur(14px) saturate(1.2);
        backdrop-filter: blur(14px) saturate(1.2);
        border: 1px solid var(--panel-edge);
        border-radius: var(--r);
        cursor: pointer;
        transition: color 0.2s var(--ease), border-color 0.2s var(--ease),
          transform 0.2s var(--ease);
      }
      #controls-toggle:hover { color: var(--accent); border-color: var(--accent-dim); }
      #controls-toggle:active { transform: scale(0.94); }
      #controls-toggle:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
      #controls-toggle svg { width: 1.25rem; height: 1.25rem; display: block; }

      /* ─────────────────────────── the drawer ───────────────────────────
         Slides in from the left over the canvas. Closed by default (translated
         off-screen + `inert`, set by drawer.ts); `.open` slides it in.
         Translucent + backdrop-blur so the fractal bleeds through (atmosphere,
         and a visual "this controls that"). `width: min(21rem, 86vw)` keeps it
         off a narrow phone's full width; the column layout + `overflow-y: auto`
         stack the controls and scroll on a short viewport. Touch-tuned with
         safe-area insets and `100dvh` for mobile browser chrome. */
      form#controls {
        position: fixed;
        top: 0;
        left: 0;
        z-index: 20;
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        width: min(21rem, 86vw);
        height: 100dvh;
        margin: 0;
        /* Top padding clears the floating crosshair toggle. */
        padding:
          calc(env(safe-area-inset-top) + 4.4rem)
          1.35rem
          calc(env(safe-area-inset-bottom) + 1.35rem)
          max(1.35rem, env(safe-area-inset-left));
        overflow-y: auto;
        overscroll-behavior: contain;
        color: var(--ink);
        background: var(--panel);
        -webkit-backdrop-filter: blur(22px) saturate(1.25);
        backdrop-filter: blur(22px) saturate(1.25);
        border-right: 1px solid var(--panel-edge);
        /* the instrument texture: barely-there horizontal scanlines */
        background-image: repeating-linear-gradient(
          to bottom,
          rgba(255, 255, 255, 0.018) 0,
          rgba(255, 255, 255, 0.018) 1px,
          transparent 1px,
          transparent 3px
        );
        transform: translateX(-101%);
        transition: transform 0.26s var(--ease);
      }
      form#controls.open { transform: translateX(0); }

      /* ── wordmark header ── */
      .console-head {
        display: flex;
        align-items: baseline;
        gap: 0.55rem;
        margin-bottom: 1.6rem;
      }
      .console-head .mark {
        font-family: var(--font-tech);
        font-weight: 600;
        font-size: 0.72rem;
        letter-spacing: 0.34em;
        text-transform: uppercase;
        color: var(--ink);
      }
      .console-head .sub {
        margin-left: auto;
        font-size: 0.62rem;
        letter-spacing: 0.1em;
        color: var(--ink-dim);
      }
      .console-head .sub b { color: var(--accent); font-weight: 500; }

      /* ── coordinate instrument (O1 + drawer consolidation) ──
         One readout cluster directly under the wordmark gathering ALL of the
         image's complex-plane state in a single place: the view centre
         (re / im / zoom, read-only, written on every commit by main.ts) and
         the Julia seed `c` (editable; dim in Mandelbrot, lit in Julia). This
         replaces the old split — a coords strip up here and a separate
         "Constant · c" control at the foot of the form — so the panel reads as
         one instrument rather than two scattered coordinate spots.

         A two-column grid (key | value) keeps every value on a shared left
         edge; tabular figures stop the digits jittering as they tick. */
      .coords {
        margin: -0.5rem 0 1.5rem;
      }
      .coords__legend {
        display: flex;
        align-items: center;
        gap: 0.6rem;
        margin: 0 0 0.7rem;
        font-family: var(--font-tech);
        font-weight: 500;
        font-size: 0.575rem;
        letter-spacing: 0.24em;
        text-transform: uppercase;
        color: var(--ink-dim);
        white-space: nowrap;
      }
      /* a hairline that runs out from the word to the panel edge */
      .coords__legend::after {
        content: "";
        flex: 1 1 auto;
        height: 1px;
        background: var(--hair);
      }
      .coords__grid {
        margin: 0;
        display: grid;
        gap: 0.3rem;
        font-variant-numeric: tabular-nums;
      }
      .coord {
        display: grid;
        grid-template-columns: 2.6rem 1fr;
        align-items: baseline;
        column-gap: 0.55rem;
      }
      .coord__key {
        font-family: var(--font-tech);
        font-weight: 500;
        font-size: 0.59rem;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--ink-faint);
      }
      .coord__val {
        margin: 0;
        font-family: var(--font-mono);
        font-size: 0.84rem;
        letter-spacing: 0.01em;
        color: var(--ink);
        white-space: nowrap;
      }

      /* The seed `c`, editable inline in the value column. The inputs size to
         their own content (`field-sizing` where supported, a `ch` fallback
         elsewhere) so the trailing `i` trails the digits instead of being
         pushed to the panel's right edge — they read as a typeset c = a + b·i,
         not a stretched form row. */
      .coord--c .coord__val {
        display: flex;
        align-items: baseline;
        gap: 0.32rem;
      }
      .coord--c .c-tok { color: var(--ink-dim); font-weight: 400; }
      .coord--c input {
        appearance: none;
        -webkit-appearance: none;
        width: 7ch;            /* fallback width for ~±0.xxxxx */
        min-width: 3ch;
        field-sizing: content; /* shrink/grow to the value (Chromium) */
        margin: 0;
        padding: 0;
        font: inherit;
        font-variant-numeric: tabular-nums;
        color: var(--ink);
        background: transparent;
        border: none;
        cursor: text;
      }
      /* Keep the accent tint, but add a non-colour cue (WCAG 2.4.7/1.4.1):
         an underline rather than a border so the typeset `c = a + b·i` row
         doesn't shift when a field takes focus. */
      .coord--c input:focus-visible {
        outline: none;
        color: var(--accent);
        text-decoration: underline;
        text-underline-offset: 0.2em;
      }
      .coord--c input::-webkit-outer-spin-button,
      .coord--c input::-webkit-inner-spin-button { appearance: none; margin: 0; }
      .coord--c input[type="number"] { -moz-appearance: textfield; }
      .coord--c input:disabled { cursor: default; }
      /* Mandelbrot mode: dim the whole `c` row (via :has) so the visitor reads
         the seed as "off", not just the two fields. */
      .coord--c:has(input:disabled) { opacity: 0.4; }

      /* Depth meter (#98): a thin log-scale bar + compact "N.N / 13" readout
         sharing the value column — the bar grows as the zoom descends into the
         f64 precision budget (ADR-0006). main.ts drives --fill (0..1) and the
         label on every commit, and adds .depth--near for the last ~15%. */
      .coord--depth .coord__val {
        display: flex;
        align-items: baseline;
        gap: 0.55rem;
      }
      .depth {
        flex: 1 1 auto;
        height: 0.45rem;
        align-self: center;
        background: var(--hair);
        border-radius: var(--r);
        overflow: hidden;
      }
      .depth__fill {
        display: block;
        height: 100%;
        width: calc(var(--fill, 0) * 100%);
        background: var(--accent);
        border-radius: inherit;
        transition: width 0.26s var(--ease), background 0.26s var(--ease);
      }
      .depth--near .depth__fill { background: var(--warn); }
      .depth__num {
        flex: 0 0 auto;
        font-size: 0.78rem;
        color: var(--ink-dim);
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }

      /* Off-screen mirror of the readout as one string, so a screen reader
         announces the settled view as a single utterance (the visible cells
         carry aria-hidden). */
      .visually-hidden {
        position: absolute;
        width: 1px;
        height: 1px;
        margin: -1px;
        padding: 0;
        border: 0;
        overflow: hidden;
        clip: rect(0 0 0 0);
        clip-path: inset(50%);
        white-space: nowrap;
      }

      /* ── a control row ──
         A tiny uppercase label stacked over a borderless native control, with
         a hairline beneath: the form reads as a stack of instrument readouts
         rather than a stack of boxes. */
      form#controls label.field {
        position: relative;
        display: block;
        margin: 0;
        padding: 0.7rem 0 0.65rem;
        border-bottom: 1px solid var(--hair);
      }
      form#controls label.field:first-of-type { border-top: 1px solid var(--hair); }

      .field__label {
        display: block;
        font-family: var(--font-tech);
        font-weight: 500;
        font-size: 0.595rem;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: var(--ink-dim);
        margin: 0 0 0.15rem;
        transition: color 0.15s var(--ease);
      }
      .field:focus-within .field__label { color: var(--accent); }
      /* A non-colour focus cue for the borderless selects (WCAG 2.4.7/1.4.1):
         a box-shadow lays a second accent line under the row's existing
         hairline, so the underline visibly *thickens* on focus — a shape
         change, not colour alone. box-shadow takes no layout space, so the
         rows don't shift. Mirrors the box-shadow focus ring the range thumb
         and toggle already use; the accent border-colour rides along as a
         secondary cue. */
      .field:focus-within {
        border-bottom-color: var(--accent);
        box-shadow: 0 1px 0 0 var(--accent);
      }

      /* The wrapper carries the custom caret — a <select> can't host ::after.
         Block so the native control's `width: 100%` resolves against it. */
      .field__control { position: relative; display: block; }
      .field__control::after {
        content: "";
        position: absolute;
        right: 0.1rem;
        top: 50%;
        width: 0.62rem;
        height: 0.62rem;
        translate: 0 -45%;
        pointer-events: none;
        background: var(--ink-dim);
        transition: background 0.15s var(--ease);
        /* a thin chevron, drawn as a clip-path so it inherits colour */
        clip-path: polygon(8% 28%, 50% 70%, 92% 28%, 80% 18%, 50% 52%, 20% 18%);
      }
      .field:hover .field__control::after { background: var(--accent); }
      .field__control--range::after { content: none; }   /* slider, no caret */

      /* The native control, stripped to a transparent readout. */
      select {
        appearance: none;
        -webkit-appearance: none;
        width: 100%;
        min-height: 2.6rem;       /* comfortable touch target */
        margin: 0;
        padding: 0 1.1rem 0 0;
        font-family: var(--font-mono);
        font-weight: 500;
        font-size: 1.02rem;
        letter-spacing: 0.01em;
        color: var(--ink);
        background: transparent;
        border: none;
        border-radius: 0;
        cursor: pointer;
      }
      select:focus-visible { outline: none; color: var(--accent); }
      /* Keep the native popup dark even where it can't be restyled. */
      select option { background: #0d1016; color: var(--ink); }

      /* ── Presentation toggles: Orbit (E1, #94) + Inspect (E2, #95) ──
         Two binary switches share one instrument row instead of stacking on a
         line each. The control is a rectangular *rocker* switch, not a pill:
         the skin's only rounding is --r (near-square, "instrument not card"),
         so a fully-round toggle would read as foreign. A hairline track holds a
         near-square knob that slides left→right; flipping on fills the track
         with the live --accent and flips the knob to the page ground so it
         reads on accent — the same accent-fill / ground-mark logic the readout
         selects and the old tick used. The inputs stay real checkboxes
         (switch-styled by CSS only), so controls.ts binds them unchanged. */
      .toggles {
        display: flex;
        justify-content: space-between;
        align-items: stretch;
        gap: 1rem;
        border-bottom: 1px solid var(--hair);
      }
      /* The full label is the hit target, so the row's vertical rhythm lives
         here (not on the container) — clicking anywhere in the row height
         toggles, matching the touch area the stacked .field rows had. */
      .toggle {
        display: inline-flex;
        align-items: center;
        gap: 0.7rem;
        margin: 0;
        padding: 0.7rem 0 0.65rem;
        min-height: 2.6rem;
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
      }
      /* The row label, borrowing the field label's tech-mono voice but inline. */
      .toggle__name {
        font-family: var(--font-tech);
        font-weight: 500;
        font-size: 0.595rem;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: var(--ink-dim);
        transition: color 0.15s var(--ease);
      }
      .toggle:hover .toggle__name { color: var(--ink); }
      /* Label tracks the switch state/focus the way fields light their label. */
      .toggle:focus-within .toggle__name,
      .toggle:has(input:checked) .toggle__name { color: var(--accent); }

      .toggle input[type="checkbox"] {
        appearance: none;
        -webkit-appearance: none;
        position: relative;
        flex: 0 0 auto;
        width: 2.3rem;
        height: 1.25rem;
        margin: 0;
        border: 1px solid var(--ink-faint);
        border-radius: var(--r);
        background: transparent;
        cursor: pointer;
        transition: border-color 0.15s var(--ease), background 0.15s var(--ease);
      }
      /* The knob: a near-square slug parked at the track's left lip. */
      .toggle input[type="checkbox"]::after {
        content: "";
        position: absolute;
        top: 50%;
        left: 2px;
        width: 0.78rem;
        height: 0.78rem;
        translate: 0 -50%;
        border-radius: 2px;
        background: var(--ink-faint);
        transition: translate 0.18s var(--ease), background 0.15s var(--ease);
      }
      .toggle:hover input[type="checkbox"] { border-color: var(--accent); }
      .toggle:hover input[type="checkbox"]::after { background: var(--ink-dim); }
      .toggle input[type="checkbox"]:checked {
        border-color: var(--accent);
        background: var(--accent);
      }
      .toggle input[type="checkbox"]:checked::after {
        /* slide to the track's right lip: width − knob − (2px lip × 2 + 2px) */
        translate: calc(2.3rem - 0.78rem - 6px) -50%;
        background: #05070b;       /* page ground, so the knob reads on accent */
      }
      .toggle input[type="checkbox"]:focus-visible {
        outline: none;
        border-color: var(--accent);
        box-shadow: 0 0 0 2px var(--accent-dim);
      }
      @media (prefers-reduced-motion: reduce) {
        .toggle input[type="checkbox"]::after { transition: background 0.15s var(--ease); }
      }

      /* ── Iterations as a log slider ──
         The value spans seven doublings (64–8192), so a linear stepper is
         wrong — controls.ts feeds the range a plain 0..N-1 *index* into a
         geometric stop table (MAX_ITER_STOPS), so equal travel = equal ratio
         and the control reads logarithmically without any maths in the CSS.
         The current stop shows in the label's right-aligned readout, updated
         live on drag (the recompute still fires only on commit; see ADR-0012
         and controls.ts). The native control is stripped to a hairline track
         + accent thumb to match the instrument skin. */
      .field--range .field__label {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
      }
      .field__readout {
        font-family: var(--font-mono);
        font-weight: 500;
        font-size: 0.92rem;
        letter-spacing: 0.01em;
        text-transform: none;     /* a number, not a label */
        font-variant-numeric: tabular-nums;
        color: var(--ink);
        transition: color 0.15s var(--ease);
      }
      .field--range:focus-within .field__readout { color: var(--accent); }
      .field__control--range { display: flex; align-items: center; min-height: 2.6rem; }
      .field--range input[type="range"] {
        appearance: none;
        -webkit-appearance: none;
        width: 100%;
        margin: 0;
        background: transparent;   /* the track is drawn on the sub-element */
        cursor: pointer;
      }
      /* Track — a thin hairline the thumb rides along. WebKit and Firefox need
         separate pseudo-elements (a shared rule would be dropped wholesale by
         either engine on the unknown selector). */
      .field--range input[type="range"]::-webkit-slider-runnable-track {
        height: 2px;
        border-radius: 2px;
        background: var(--ink-faint);
      }
      .field--range input[type="range"]::-moz-range-track {
        height: 2px;
        border-radius: 2px;
        background: var(--ink-faint);
      }
      /* Thumb — accent dot. WebKit needs the negative margin to centre it on
         the 2px track (Firefox centres its thumb automatically). */
      .field--range input[type="range"]::-webkit-slider-thumb {
        appearance: none;
        -webkit-appearance: none;
        width: 0.85rem;
        height: 0.85rem;
        margin-top: calc((2px - 0.85rem) / 2);
        border: none;
        border-radius: 50%;
        background: var(--accent);
        transition: box-shadow 0.15s var(--ease), transform 0.15s var(--ease);
      }
      .field--range input[type="range"]::-moz-range-thumb {
        width: 0.85rem;
        height: 0.85rem;
        border: none;
        border-radius: 50%;
        background: var(--accent);
        transition: box-shadow 0.15s var(--ease), transform 0.15s var(--ease);
      }
      .field--range input[type="range"]:hover::-webkit-slider-thumb { transform: scale(1.12); }
      .field--range input[type="range"]:hover::-moz-range-thumb { transform: scale(1.12); }
      .field--range input[type="range"]:focus-visible { outline: none; }
      .field--range input[type="range"]:focus-visible::-webkit-slider-thumb {
        box-shadow: 0 0 0 4px var(--accent-dim);
      }
      .field--range input[type="range"]:focus-visible::-moz-range-thumb {
        box-shadow: 0 0 0 4px var(--accent-dim);
      }

      /* ── progressive enhancement: fully styled native popup where supported ──
         Chrome/Edge 135+ (~70% of users as of 2026); everywhere else the rules
         above already give a clean closed control + a dark native popup, so
         this is pure enhancement with the native element as the fallback. */
      @supports (appearance: base-select) {
        select, ::picker(select) { appearance: base-select; }
        select { padding-right: 1.1rem; border: none; }
        select::picker-icon { display: none; }   /* we draw our own caret */
        ::picker(select) {
          margin-top: 0.4rem;
          padding: 0.3rem;
          background: rgba(13, 16, 22, 0.92);
          -webkit-backdrop-filter: blur(22px);
          backdrop-filter: blur(22px);
          border: 1px solid var(--panel-edge);
          border-radius: var(--r);
          box-shadow: 0 18px 48px rgba(0, 0, 0, 0.55);
          --anchor-gap: 0;
        }
        select option {
          padding: 0.5rem 0.7rem;
          font-family: var(--font-mono);
          font-size: 0.95rem;
          color: var(--ink-dim);
          border-radius: 2px;
        }
        option:hover, option:focus { background: var(--accent-dim); color: var(--ink); }
        option:checked { color: var(--accent); }
        option::checkmark { content: "›"; margin-right: 0.4rem; color: var(--accent); }
      }

      /* ── one orchestrated load moment: staggered reveal of the rows on open ── */
      form#controls.open .console-head,
      form#controls.open .coords,
      form#controls.open .field {
        animation: ev-rise 0.42s var(--ease) backwards;
      }
      form#controls.open .console-head { animation-delay: 0.02s; }
      form#controls.open .coords { animation-delay: 0.05s; }
      form#controls.open .field:nth-of-type(1) { animation-delay: 0.06s; }
      form#controls.open .field:nth-of-type(2) { animation-delay: 0.1s; }
      form#controls.open .field:nth-of-type(3) { animation-delay: 0.14s; }
      form#controls.open .field:nth-of-type(4) { animation-delay: 0.18s; }
      form#controls.open .field:nth-of-type(5) { animation-delay: 0.22s; }
      form#controls.open .field:nth-of-type(6) { animation-delay: 0.26s; }
      @keyframes ev-rise {
        from { opacity: 0; transform: translateY(7px); }
        to   { opacity: 1; transform: translateY(0); }
      }

      /* ── PNG export actions (O2, #92) ──
         A two-button action row pinned to the foot of the controls drawer,
         skinned like the console's other buttons. Actions, not fields, so they
         sit outside the `.field` rise-animation sequence. */
      .export-actions {
        display: flex;
        gap: 0.5rem;
        margin-top: 0.9rem;
        padding-top: 0.9rem;
        border-top: 1px solid var(--panel-edge);
      }
      .export-btn {
        flex: 1;
        padding: 0.55rem 0.6rem;
        font-family: var(--font-tech);
        font-size: 0.62rem;
        font-weight: 500;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--ink);
        background: var(--panel);
        border: 1px solid var(--panel-edge);
        border-radius: var(--r);
        cursor: pointer;
        transition: color 0.15s var(--ease), border-color 0.15s var(--ease);
      }
      .export-btn:hover { color: var(--accent); border-color: var(--accent-dim); }
      .export-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
      .export-btn:disabled { opacity: 0.5; cursor: progress; }

      /* ── PWA UI (Slice 8B), re-skinned to the console ──
         The Install button sits in normal flow under the canvas; the update /
         offline-ready toast floats bottom-right. Both are created and toggled
         by the pwa-ui presenter via the `hidden` attribute, so they take no
         space until the lifecycle calls for them. */
      #pwa-install {
        /* Fixed, not in-flow: an in-flow button below the canvas shrinks the
           stage when `beforeinstallprompt` un-hides it, firing the
           fit-to-window ResizeObserver and an unrequested refit + recompute
           (the common trigger of bug #72). Bottom-left clears the top-left
           toggle and the bottom-right toast / inspector / progress. */
        position: fixed;
        bottom: max(1rem, env(safe-area-inset-bottom));
        left: max(1rem, env(safe-area-inset-left));
        z-index: 40;
        padding: 0.55rem 1rem;
        font-family: var(--font-tech);
        font-size: 0.62rem;
        font-weight: 500;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: var(--ink);
        background: var(--panel);
        -webkit-backdrop-filter: blur(14px);
        backdrop-filter: blur(14px);
        border: 1px solid var(--panel-edge);
        border-radius: var(--r);
        cursor: pointer;
      }
      #pwa-install:hover { color: var(--accent); border-color: var(--accent-dim); }
      #pwa-install[hidden], .pwa-toast[hidden] { display: none; }
      /* The button is fixed bottom-left at a higher z-index than the drawer
         (z-index 20), so while the drawer is open it would overlay the drawer's
         bottom-left controls and intercept their clicks. Hide it for the
         duration the drawer is open. (#pwa-install is a later sibling of
         form#controls in the body, so the general-sibling combinator reaches
         it.) */
      form#controls.open ~ #pwa-install { display: none; }
      .pwa-toast {
        position: fixed;
        bottom: max(1rem, env(safe-area-inset-bottom));
        right: max(1rem, env(safe-area-inset-right));
        z-index: 40;
        display: flex;
        gap: 0.6rem;
        align-items: center;
        padding: 0.7rem 0.9rem;
        font-size: 0.82rem;
        color: var(--ink);
        background: var(--panel);
        -webkit-backdrop-filter: blur(18px) saturate(1.2);
        backdrop-filter: blur(18px) saturate(1.2);
        border: 1px solid var(--panel-edge);
        border-radius: var(--r);
        box-shadow: 0 12px 36px rgba(0, 0, 0, 0.5);
      }
      .pwa-toast button {
        min-height: 2.4rem;       /* comfortable thumb target on a fixed corner element */
        padding: 0.5rem 0.9rem;
        font-family: var(--font-tech);
        font-size: 0.58rem;
        font-weight: 500;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--ink);
        background: transparent;
        border: 1px solid var(--panel-edge);
        border-radius: 2px;
        cursor: pointer;
      }
      .pwa-toast button:hover { color: var(--accent); border-color: var(--accent-dim); }

      /* Fatal-error surface (B4 / U2): a full-screen scrim shown by fatal.ts
         when the renderer can't run at all (WASM failed, not cross-origin
         isolated, worker never readied). Highest z-index so it covers the
         stage; reuses the panel/ink tokens for visual continuity. */
      .fatal {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
        background: rgba(7, 9, 13, 0.86);
        -webkit-backdrop-filter: blur(8px);
        backdrop-filter: blur(8px);
      }
      .fatal__panel {
        max-width: 32rem;
        padding: 1.6rem 1.8rem;
        color: var(--ink);
        background: var(--panel);
        border: 1px solid var(--panel-edge);
        border-radius: var(--r);
        box-shadow: 0 16px 48px rgba(0, 0, 0, 0.6);
      }
      .fatal__title {
        margin: 0 0 0.7rem;
        font-family: var(--font-tech);
        font-size: 0.72rem;
        font-weight: 500;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: var(--accent);
      }
      .fatal__detail {
        margin: 0 0 1.2rem;
        font-size: 0.86rem;
        line-height: 1.5;
        color: var(--ink-dim);
      }
      .fatal__reload {
        padding: 0.5rem 1.1rem;
        font-family: var(--font-tech);
        font-size: 0.6rem;
        font-weight: 500;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: var(--ink);
        background: transparent;
        border: 1px solid var(--panel-edge);
        border-radius: 2px;
        cursor: pointer;
      }
      .fatal__reload:hover { color: var(--accent); border-color: var(--accent-dim); }
      .fatal__reload:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

      /* Determinate render-progress indicator (P2): a small status pill shown
         by progress.ts only while a slow deep render streams its bands. Pinned
         bottom-right, out of the way of the top-left controls toggle; reuses
         the panel/ink tokens for continuity. `hidden` removes it entirely when
         idle (the common case). */
      .progress {
        position: fixed;
        right: 1rem;
        bottom: 1rem;
        z-index: 50;
        padding: 0.4rem 0.8rem;
        font-family: var(--font-tech);
        font-size: 0.62rem;
        font-weight: 500;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--ink-dim);
        background: var(--panel);
        border: 1px solid var(--panel-edge);
        border-radius: 2px;
        -webkit-backdrop-filter: blur(8px);
        backdrop-filter: blur(8px);
        pointer-events: none;
      }
      .progress[hidden] { display: none; }

      /* Respect a reduced-motion preference: snap instead of slide, and skip
         the staggered reveal. Last in the cascade so it overrides the slide /
         reveal rules above it. */
      @media (prefers-reduced-motion: reduce) {
        form#controls, #controls-toggle, .vignette { transition: none; }
        form#controls.open .console-head, form#controls.open .coords,
        form#controls.open .field { animation: none; }
        /* The depth meter snaps to its value instead of sliding on each commit. */
        .depth__fill { transition: none; }
      }
    </style>
  </head>
  <body>
    <!-- Empty on purpose: drawer.ts injects the crosshair / ✕ SVG glyph and
         keeps aria-label + aria-expanded in step with the open state. -->
    <button
      id="controls-toggle"
      type="button"
      aria-label="Open controls"
      aria-controls="controls"
      aria-expanded="false"
    ></button>
    <form id="controls">
      <div class="console-head">
        <span class="mark">Escape&nbsp;Velocity</span>
        <span class="sub">z<b>²</b>+c</span>
      </div>
      <!-- Coordinate instrument (O1 + drawer consolidation): every piece of the
           image's complex-plane state in one cluster. main.ts writes the view
           centre cells (re/im/zoom) on every commit; the `c` row holds the
           editable Julia seed (controls.ts enables/disables it by mode).

           The three read-only cells are individually aria-hidden — the
           off-screen #coords mirror carries them as one aria-live="polite"
           string so a screen reader announces the settled view once, never
           mid-gesture. The `c` row is deliberately NOT hidden: its inputs are
           focusable in Julia mode, and a focusable control inside an
           aria-hidden subtree is an accessibility trap (its label is dropped
           from the tree). It exposes its own labelled inputs instead. -->
      <section class="coords" aria-labelledby="coords-legend">
        <h2 class="coords__legend" id="coords-legend">Coordinates</h2>
        <dl class="coords__grid">
          <div class="coord" aria-hidden="true">
            <dt class="coord__key">re</dt>
            <dd class="coord__val" data-coord="re">—</dd>
          </div>
          <div class="coord" aria-hidden="true">
            <dt class="coord__key">im</dt>
            <dd class="coord__val" data-coord="im">—</dd>
          </div>
          <div class="coord" aria-hidden="true">
            <dt class="coord__key">zoom</dt>
            <dd class="coord__val" data-coord="zoom">—</dd>
          </div>
          <!-- Depth meter (#98): how deep the zoom sits in the f64 precision
               budget (ADR-0006, ~10^13 ceiling). main.ts sets --fill and the
               numeric label on every commit; the off-screen #coords mirror
               carries "depth N.N / 13" so it reaches screen readers too. -->
          <div class="coord coord--depth" aria-hidden="true">
            <dt class="coord__key">depth</dt>
            <dd class="coord__val">
              <span class="depth"><i class="depth__fill"></i></span>
              <span class="depth__num" data-coord="depth">—</span>
            </dd>
          </div>
          <div class="coord coord--c">
            <dt class="coord__key">c</dt>
            <dd class="coord__val">
              <input type="number" name="c-re" step="0.0001" value="-0.7" disabled
                aria-label="c real part" />
              <span class="c-tok">+</span>
              <input type="number" name="c-im" step="0.0001" value="0.27015" disabled
                aria-label="c imaginary part" />
              <span class="c-tok">i</span>
            </dd>
          </div>
        </dl>
        <p id="coords" class="visually-hidden" aria-live="polite"></p>
      </section>
      <label class="field field--range">
        <span class="field__label">
          Iterations
          <!-- Live readout of the slider's current stop. controls.ts drives
               the slider's min/max/value and this text from MAX_ITER_STOPS;
               the markup just supplies the elements. -->
          <output class="field__readout" for="max-iter">256</output>
        </span>
        <span class="field__control field__control--range">
          <input type="range" id="max-iter" name="max-iter" aria-label="Iterations" />
        </span>
      </label>
      <label class="field">
        <span class="field__label">Resolution</span>
        <span class="field__control">
          <select name="render-scale">
            <option value="0.5">0.5× · faster</option>
            <option value="1" selected>1×</option>
            <option value="2">2× · sharper</option>
          </select>
        </span>
      </label>
      <label class="field">
        <span class="field__label">Field</span>
        <span class="field__control">
          <select name="field">
            <option value="escape-time" selected>Escape Time</option>
            <option value="distance-estimate">Distance Estimate</option>
          </select>
        </span>
      </label>
      <label class="field">
        <span class="field__label">Palette</span>
        <span class="field__control">
          <select name="palette">
            <option value="grayscale">Grayscale</option>
            <option value="viridis" selected>Viridis</option>
            <option value="magma">Magma</option>
            <option value="inferno">Inferno</option>
            <option value="plasma">Plasma</option>
            <option value="turbo">Turbo</option>
            <option value="cubehelix">Cubehelix</option>
            <option value="twilight">Twilight</option>
            <option value="earth-and-sky">Earth &amp; Sky</option>
            <option value="rainbow">Rainbow</option>
            <option value="kahol-lavan">Kahol&ndash;Lavan</option>
            <option value="ocean">Ocean</option>
            <option value="solar">Solar</option>
            <option value="spectral">Spectral</option>
            <option value="cosmic">Cosmic</option>
          </select>
        </span>
      </label>
      <label class="field">
        <span class="field__label">Coloring</span>
        <span class="field__control">
          <select name="normalisation">
            <option value="cycled" selected>Cycled</option>
            <option value="histogram">Match palette to image</option>
            <option value="linear">Linear</option>
            <option value="sqrt">Square root</option>
            <option value="logarithmic">Logarithmic</option>
            <option value="clamped">Clamped (filaments)</option>
          </select>
        </span>
      </label>
      <label class="field">
        <span class="field__label">Fractal</span>
        <span class="field__control">
          <select name="mode">
            <option value="mandelbrot" selected>Mandelbrot</option>
            <option value="julia">Julia</option>
          </select>
        </span>
      </label>
      <!-- Presentation toggles, sharing one row.
           Orbit (E1, #94): hover the canvas to trace a point's iteration orbit,
             click to pin it. Persisted in the URL hash like the view settings.
           Inspect (E2, #95): hover to read the pixel under the cursor — its
             coordinate, raw Field value, normalised t, and painted colour. A
             view-only tool, so unlike Orbit it is not persisted in the hash.
           Both stay native checkboxes — switch-styled by CSS only, so the
           browser keeps the checked state in the a11y tree and controls.ts
           binds them by name unchanged. -->
      <div class="toggles">
        <label class="toggle">
          <span class="toggle__name">Orbit</span>
          <input type="checkbox" name="orbit" />
        </label>
        <label class="toggle">
          <span class="toggle__name">Inspect</span>
          <input type="checkbox" name="inspect" />
        </label>
      </div>
      <!-- PNG export (O2, #92). Actions, not form state: wired directly in
           main.ts (no settings snapshot, no rerender). Both render the current
           view off-screen so the saved pixels always match the permalink in the
           filename; 1× matches the on-screen resolution, 2× supersamples. -->
      <div class="export-actions">
        <button type="button" id="export-png" class="export-btn">Save PNG</button>
        <button type="button" id="export-png-2x" class="export-btn">Save PNG 2&times;</button>
      </div>
    </form>
    <div class="stage">
      <canvas id="fractal" width="800" height="600"></canvas>
      <!-- Unified probe instrument (E1 + E2): the orbit diagram and the pixel
           inspector share one corner panel. The orbit canvas is drawn by
           orbit.ts; the readout is populated by inspector.ts. Each section
           hides on its own toggle, and the panel auto-collapses (CSS `:has`)
           when neither is shown. -->
      <div class="probe">
        <canvas id="orbit" hidden aria-hidden="true"></canvas>
        <div id="inspector" class="inspector" hidden aria-live="polite"></div>
      </div>
    </div>
    <div class="vignette"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
