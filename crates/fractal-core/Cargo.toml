[package]
name = "fractal-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Mandelbrot/Julia escape-time iteration and coloring. Pure Rust, no WebAssembly dependency."

[dependencies]
# Data-parallelism for the per-pixel escape-time loop (Slice 7A). Pure
# Rust with no WebAssembly dependency, so the crate keeps its charter:
# natively it fans out over OS threads; in the browser the worker drives
# it through the `wasm-bindgen-rayon` thread pool (wired in Slice 7C).
rayon = "1"

[dev-dependencies]
# Property-based tests for the viewport coordinate invariants (round-trips,
# pan/zoom symmetry, the ADR-0011 reference-width rule), which generalise the
# example-based tests in `viewport.rs` over randomised inputs.
proptest = "1"
# Micro-benchmark harness for the per-pixel kernels (P7, #83): the Brent
# periodicity check returns the same NaN sentinel sooner, so its win is
# invisible to the bit-identical output tests and is measured here instead.
# `fractal-core` is pure Rust, so the bench runs natively on the pinned stable
# toolchain with no wasm in the loop.
criterion = "0.5"

# Whole-frame compute timing for the kernels (see `benches/escape.rs`).
[[bench]]
name = "escape"
harness = false
